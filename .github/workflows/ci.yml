name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PyYAML for the benchmark checks
        run: python3 -m pip install pyyaml

      - name: Unit and integration tests
        run: npm test

      - name: Documentation links and bilingual pairs
        run: npm run docs:check

      - name: No private names or machine paths
        run: npm run privacy:check

      - name: Benchmark protocol check (no model calls)
        run: npm run bench:verify
