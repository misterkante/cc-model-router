name: Feature request
description: Suggest an idea or a new routing policy
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain are you hitting? Cost, quota, quality, workflow, integration?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen? Keep it concrete and testable if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Native Claude Code features, other routers, config workarounds.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Claude Code core
        - OpenCode
        - benchmark
        - docs
        - other
    validations:
      required: true
